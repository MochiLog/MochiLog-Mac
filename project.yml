name: MochiLogMac
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
options:
  deploymentTarget:
    macOS: "27.0"
targets:
  MochiLogMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/MacTransfer.xcstrings
      - path: Resources/InfoPlist.xcstrings
    dependencies:
      - package: Sparkle
        product: Sparkle
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ryuya-dev.MochiLog.mac
        PRODUCT_NAME: MochiLog Mac
        MARKETING_VERSION: "0.2.6"
        CURRENT_PROJECT_VERSION: "9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MochiLog Mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: iPhoneへ解析ログを転送するためにローカルネットワークを使用します。
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacCompanion.entitlements
    entitlements:
      path: MacCompanion.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
