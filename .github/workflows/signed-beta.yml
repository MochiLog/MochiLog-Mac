name: Signed beta DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-beta:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          brew install xcodegen
          fastlane --version
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MOCHILOG_CERTIFICATE_P12_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/mochilog-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P '' -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
      - name: Build, sign, and notarize app and DMG
        env:
          MOCHILOG_NOTARY_KEY_BASE64: ${{ secrets.MOCHILOG_NOTARY_KEY_BASE64 }}
          MOCHILOG_NOTARY_KEY_ID: ${{ secrets.MOCHILOG_NOTARY_KEY_ID }}
          MOCHILOG_NOTARY_ISSUER_ID: ${{ secrets.MOCHILOG_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$MOCHILOG_NOTARY_KEY_BASE64"
          test -n "$MOCHILOG_NOTARY_KEY_ID"
          test -n "$MOCHILOG_NOTARY_ISSUER_ID"
          printf '%s' "$MOCHILOG_NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
          export MOCHILOG_NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          export MOCHILOG_PYTHON_BIN=python3.13
          fastlane mac beta_dmg
          fastlane mac notarize_beta
          xcrun stapler validate 'Build/DerivedData/Build/Products/Release/MochiLog Mac.app'
          xcrun stapler validate Build/MochiLog-Mac-Beta.dmg
          spctl --assess --type execute --verbose 'Build/DerivedData/Build/Products/Release/MochiLog Mac.app'
          cd Build
          shasum -a 256 MochiLog-Mac-Beta.dmg > MochiLog-Mac-Beta.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MochiLog-Mac-Beta-notarized-${{ github.run_number }}
          path: |
            Build/MochiLog-Mac-Beta.dmg
            Build/MochiLog-Mac-Beta.sha256
          if-no-files-found: error
          retention-days: 90
